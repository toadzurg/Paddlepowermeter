; Build: pio run        Flash: pio run -t upload        Monitor: pio device monitor
; Host-side algorithm tests (no hardware): ./test/host/run.sh

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; lib/ESP32_BLE is the 2018 standalone copy of the BLE library. The ESP32
; Arduino core ships the maintained version under the same header names, so
; use that one to avoid duplicate/incompatible BLE definitions.
lib_ignore = ESP32 BLE Arduino
