; Paddle:     pio run -t upload            (default env)
; Boat node:  pio run -e boat -t upload    (impeller reader in the hull)
; Monitor:    pio device monitor
; Host-side algorithm tests (no hardware): ./test/host/run.sh

[platformio]
default_envs = paddle

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; BLE + Wi-Fi (ESP-NOW) don't fit the default 1.2 MB app partition.
board_build.partitions = min_spiffs.csv

[env:paddle]
build_src_filter = +<*> -<boat/>

[env:boat]
build_src_filter = -<*> +<boat/>
